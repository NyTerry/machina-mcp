[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machina-mcp"
version = "0.1.1"
description = "MCP server for Machina — x402-powered AI agent services (URL extraction, PDF processing, code scanning, email validation, domain intelligence)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Machina", email = "hello@mach402.dev" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "x402",
    "ai-agent",
    "agent-services",
    "machina",
    "url-extraction",
    "pdf",
    "code-scanner",
    "email-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.0.0",
    "x402[evm]>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://mach402.dev"
Documentation = "https://mach402.dev/docs/buyer-guide"
Repository = "https://github.com/NyTerry/machina-mcp"
"Bug Tracker" = "https://github.com/NyTerry/machina-mcp/issues"

[project.scripts]
machina-mcp = "machina_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["machina_mcp"]
